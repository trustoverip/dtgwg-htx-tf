name: Check documentation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build with the GitHub Pages engine
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check links and preserve existing resources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 scripts/check_docs.py --baseline "$BASE_SHA"
